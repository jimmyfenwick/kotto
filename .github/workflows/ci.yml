name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m unittest discover -s tests -v
        env:
          PYTHONDONTWRITEBYTECODE: '1'
      - run: python -m build
      - name: Install the built wheel in a clean environment
        shell: bash
        run: |
          python -m venv /tmp/kotto-wheel-check
          /tmp/kotto-wheel-check/bin/python -m pip install dist/*.whl
          /tmp/kotto-wheel-check/bin/kotto --version
          /tmp/kotto-wheel-check/bin/python -m pip check
