[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "kotto"
version = "0.1.0"
description = "A lightweight, extensible Python Agent Harness."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["httpx>=0.28.1,<0.29"]
license = "MIT"

[project.optional-dependencies]
dev = ["build==1.4.0", "ruff==0.15.9"]

[project.scripts]
kotto = "kotto.cli.main:main"

[project.urls]
Repository = "https://github.com/jimmyfenwick/kotto"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
